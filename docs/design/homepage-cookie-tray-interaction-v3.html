<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页项目烤盘 · 主要交互原型 V3</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf7;
      --ink: #181716;
      --muted: #6d6963;
      --coral: #e15b54;
      --coral-soft: #fff0ed;
      --tray-light: #ead9bb;
      --tray-mid: #c9ac78;
      --tray-dark: #9b7949;
      --tray-paper: #fff9ef;
      --focus: #c53e38;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 76% 34%, rgb(232 202 153 / 10%), transparent 26rem),
        var(--paper);
    }

    button,
    a { font: inherit; }

    .site-header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 36px;
      border-bottom: 1px solid rgb(76 69 58 / 8%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border: 1px solid #d8d2c9;
      border-radius: 50%;
      position: relative;
      background: #fff;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 14px;
      left: 11px;
      top: 6px;
      border-radius: 999px 999px 2px 2px;
      background: var(--coral);
      transform: rotate(42deg);
      transform-origin: 50% 80%;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 24px;
      color: #373431;
      font-size: 14px;
    }

    .hero {
      min-height: 690px;
      max-width: 1320px;
      margin: 0 auto;
      padding: 76px 36px 54px;
      display: grid;
      grid-template-columns: minmax(360px, .88fr) minmax(590px, 1.12fr);
      align-items: center;
      gap: 62px;
    }

    .hero-copy { padding-bottom: 90px; }

    .eyebrow {
      margin: 0 0 24px;
      color: #514d48;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(56px, 5vw, 82px);
      line-height: .98;
      letter-spacing: -.075em;
    }

    .summary {
      margin: 32px 0 38px;
      color: #4d4945;
      font-size: 20px;
      line-height: 1.7;
    }

    .actions { display: flex; align-items: center; gap: 28px; }

    .primary-action {
      display: inline-flex;
      padding: 13px 22px;
      border-radius: 8px;
      color: white;
      background: linear-gradient(135deg, #bd2f2c, #e05c54);
      text-decoration: none;
      box-shadow: 0 10px 24px rgb(173 48 42 / 13%);
    }

    .secondary-action { color: #34312e; font-weight: 650; text-decoration: none; }

    .showcase { min-width: 0; }

    .tray-stage {
      position: relative;
      width: 100%;
      height: 510px;
      isolation: isolate;
    }

    .tray {
      position: relative;
      z-index: 2;
      width: min(100%, 650px);
      aspect-ratio: 1.58;
      margin: 0 auto;
      padding: 18px;
      border: 1px solid #ad8e5e;
      border-radius: 32px;
      background:
        linear-gradient(145deg, rgb(255 255 255 / 72%), transparent 22%),
        linear-gradient(145deg, var(--tray-light), var(--tray-mid) 58%, var(--tray-dark));
      box-shadow:
        0 28px 44px rgb(80 55 25 / 12%),
        0 4px 8px rgb(80 55 25 / 10%),
        inset 0 1px 1px rgb(255 255 255 / 78%);
      transform: rotate(.35deg);
    }

    .tray::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgb(115 82 39 / 42%);
      border-radius: 26px;
      pointer-events: none;
    }

    .tray-paper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgb(120 91 52 / 20%);
      border-radius: 20px;
      background:
        radial-gradient(circle at 15% 12%, rgb(145 104 48 / 3%) 0 1px, transparent 1.4px) 0 0 / 13px 13px,
        radial-gradient(circle at 84% 65%, rgb(145 104 48 / 2.8%) 0 1px, transparent 1.4px) 0 0 / 17px 17px,
        var(--tray-paper);
      box-shadow: inset 0 4px 12px rgb(93 65 29 / 7%);
    }

    .project-grid {
      position: absolute;
      inset: 28px 42px 38px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      align-items: center;
      justify-items: center;
      column-gap: 18px;
      row-gap: 8px;
    }

    .project-item {
      position: relative;
      width: 132px;
      min-height: 138px;
      padding: 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .cookie-visual {
      position: relative;
      display: grid;
      place-items: center;
      width: 92px;
      height: 92px;
      margin: 0 auto 4px;
      transform: translate(var(--dx, 0), var(--dy, 0)) rotate(var(--tilt, 0deg));
      transform-origin: 50% 56%;
      filter: drop-shadow(0 7px 5px rgb(89 57 23 / 15%));
      transition: transform 220ms cubic-bezier(.2, .8, .2, 1), filter 220ms ease;
    }

    .cookie-shell,
    .timeline-favicon {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .project-logo {
      position: relative;
      z-index: 1;
      width: 37px;
      height: 37px;
      object-fit: contain;
    }

    .project-label {
      display: block;
      width: 100%;
      overflow: hidden;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 160ms ease, transform 220ms ease;
    }

    .project-item::after {
      content: "";
      position: absolute;
      width: 67px;
      height: 14px;
      left: 50%;
      top: 83px;
      z-index: -1;
      border-radius: 50%;
      background: rgb(111 69 25 / 14%);
      filter: blur(6px);
      opacity: 0;
      transform: translateX(-50%) scale(.55);
      transition: opacity 180ms ease, transform 220ms ease;
    }

    .project-item:hover .cookie-visual,
    .project-item:focus-visible .cookie-visual,
    .project-item.is-active .cookie-visual {
      transform: translate(var(--dx, 0), calc(var(--dy, 0) - 8px)) rotate(0deg) scale(1.045);
      filter: drop-shadow(0 13px 8px rgb(89 57 23 / 21%));
    }

    .project-item:hover::after,
    .project-item:focus-visible::after,
    .project-item.is-active::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .project-item.is-active .project-label { color: var(--coral); transform: translateY(1px); }

    .project-item:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
      border-radius: 16px;
    }

    .tray-stage.has-selection .project-item:not(.is-active) .cookie-visual { opacity: .72; }

    .maker-stamp {
      --stamp-angle: 0deg;
      position: absolute;
      right: 17px;
      bottom: 14px;
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--coral);
      border-radius: 50%;
      background: rgb(255 250 242 / 80%);
      opacity: .88;
      transform: rotate(var(--stamp-angle));
      transition: transform 260ms cubic-bezier(.2, .8, .2, 1);
    }

    .maker-stamp::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 20px;
      left: 14px;
      top: 7px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--coral) 0 52%, #c9a56d 52% 100%);
      clip-path: polygon(50% 0, 100% 100%, 50% 76%, 0 100%);
      transform: rotate(35deg);
      transform-origin: 50% 70%;
    }

    .maker-stamp::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      left: 16px;
      top: 16px;
      border-radius: 50%;
      background: #fff9ef;
    }

    .preview-drawer {
      position: absolute;
      top: 356px;
      left: 50%;
      z-index: 1;
      width: min(86%, 540px);
      min-height: 120px;
      display: grid;
      grid-template-columns: 98px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 30px 24px 18px;
      border: 1px solid rgb(159 124 72 / 42%);
      border-radius: 0 0 18px 18px;
      background:
        linear-gradient(180deg, #f1e1c7 0 15px, #fff9ef 15px 100%);
      box-shadow: 0 18px 32px rgb(76 49 20 / 11%);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -66px) scale(.985);
      transition:
        transform 260ms cubic-bezier(.2, .8, .2, 1),
        opacity 160ms ease;
    }

    .tray-stage.has-selection .preview-drawer {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
    }

    .preview-thumb {
      width: 98px;
      height: 66px;
      border: 1px solid rgb(112 88 56 / 16%);
      border-radius: 10px;
      background: #fff;
      object-fit: cover;
    }

    .preview-copy { min-width: 0; }

    .preview-eyebrow {
      display: block;
      margin-bottom: 3px;
      color: #8d7655;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .preview-title {
      display: block;
      margin-bottom: 4px;
      font-size: 16px;
      line-height: 1.25;
    }

    .preview-summary {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .preview-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid rgb(208 76 68 / 38%);
      border-radius: 999px;
      color: #b83c36;
      background: var(--coral-soft);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .preview-link:hover { background: #ffe6e2; }
    .preview-link:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    .showcase-caption {
      margin: -12px 0 0;
      color: #8a8278;
      font-size: 12px;
      text-align: center;
    }

    .interaction-note {
      max-width: 1320px;
      margin: 0 auto;
      padding: 26px 36px 42px;
      border-top: 1px solid rgb(76 69 58 / 9%);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .interaction-note strong { color: var(--ink); }

    @media (max-width: 1050px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 52px;
        gap: 24px;
      }

      .hero-copy { padding-bottom: 0; }
      .showcase { max-width: 680px; width: 100%; margin: 0 auto; }
    }

    @media (max-width: 620px) {
      .site-header { height: 64px; padding: 0 20px; }
      .site-nav span:not(:last-child) { display: none; }
      .hero { padding: 48px 18px 32px; }
      h1 { font-size: 52px; }
      .summary { font-size: 17px; }
      .tray-stage { height: 650px; }
      .tray {
        width: 100%;
        max-width: 330px;
        aspect-ratio: .68;
        border-radius: 28px;
      }

      .project-grid {
        inset: 30px 20px 48px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        row-gap: 0;
      }

      .project-item { width: 118px; min-height: 120px; }
      .cookie-visual { width: 76px; height: 76px; }
      .project-logo { width: 31px; height: 31px; }
      .project-item::after { top: 70px; }

      .preview-drawer {
        top: 462px;
        width: min(94%, 304px);
        grid-template-columns: 60px 1fr;
        padding: 28px 16px 15px;
      }

      .preview-thumb { width: 60px; height: 60px; }
      .preview-link { grid-column: 1 / -1; justify-content: center; }
      .showcase-caption { margin-top: 0; }
      .interaction-note { padding-inline: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <span class="brand"><span class="brand-mark" aria-hidden="true"></span>Gantrol</span>
    <nav class="site-nav" aria-label="示意导航">
      <span>产品</span><span>工具</span><span>文章</span><span>GitHub ↗</span>
    </nav>
  </header>

  <main class="hero">
    <section class="hero-copy" aria-labelledby="page-title">
      <p class="eyebrow">黄健楸 · Gantrol</p>
      <h1 id="page-title">计算机心理学</h1>
      <p class="summary">写 AI 与软件，也用计算机理解人。</p>
      <div class="actions">
        <a class="primary-action" href="#">阅读文章</a>
        <a class="secondary-action" href="#">GitHub ↗</a>
      </div>
    </section>

    <section class="showcase" aria-labelledby="projects-title">
      <h2 id="projects-title" hidden>六个主要产品与作品</h2>
      <div class="tray-stage" id="tray-stage">
        <div class="tray" id="project-tray">
          <div class="tray-paper">
            <div class="project-grid">
              <button class="project-item" type="button" data-project="timeline" aria-controls="project-preview" aria-expanded="false" style="--dx:-7px;--dy:3px;--tilt:-2deg">
                <span class="cookie-visual">
                  <img class="timeline-favicon" src="./assets/homepage-cookie-tray/timeline-favicon.svg" alt="" />
                </span>
                <span class="project-label">模型纪年</span>
              </button>

              <button class="project-item" type="button" data-project="aicando" aria-controls="project-preview" aria-expanded="false" style="--dx:4px;--dy:-2px;--tilt:1.8deg">
                <span class="cookie-visual">
                  <img class="cookie-shell" src="./assets/homepage-cookie-tray/cookie-shell.svg" alt="" />
                  <img class="project-logo" src="../../src/public/images/home/projects/aicando-logo.webp" alt="" />
                </span>
                <span class="project-label">AiCanDo</span>
              </button>

              <button class="project-item" type="button" data-project="agent-controller" aria-controls="project-preview" aria-expanded="false" style="--dx:8px;--dy:4px;--tilt:-1.4deg">
                <span class="cookie-visual">
                  <img class="cookie-shell" src="./assets/homepage-cookie-tray/cookie-shell.svg" alt="" />
                  <img class="project-logo" src="../../src/public/images/home/projects/agent-controller-logo.svg" alt="" />
                </span>
                <span class="project-label">Agent Controller</span>
              </button>

              <button class="project-item" type="button" data-project="aiy" aria-controls="project-preview" aria-expanded="false" style="--dx:5px;--dy:-4px;--tilt:2.4deg">
                <span class="cookie-visual">
                  <img class="cookie-shell" src="./assets/homepage-cookie-tray/cookie-shell.svg" alt="" />
                  <img class="project-logo" src="../../src/public/images/home/projects/aiy-logo.webp" alt="" />
                </span>
                <span class="project-label">AIY</span>
              </button>

              <button class="project-item" type="button" data-project="markdowncando" aria-controls="project-preview" aria-expanded="false" style="--dx:-4px;--dy:3px;--tilt:-2.5deg">
                <span class="cookie-visual">
                  <img class="cookie-shell" src="./assets/homepage-cookie-tray/cookie-shell.svg" alt="" />
                  <img class="project-logo" src="../../src/public/images/home/projects/markdowncando-logo.png" alt="" />
                </span>
                <span class="project-label">MarkdownCanDo</span>
              </button>

              <button class="project-item" type="button" data-project="paopao" aria-controls="project-preview" aria-expanded="false" style="--dx:7px;--dy:-2px;--tilt:1.2deg">
                <span class="cookie-visual">
                  <img class="cookie-shell" src="./assets/homepage-cookie-tray/cookie-shell.svg" alt="" />
                  <img class="project-logo" src="../../src/public/images/home/projects/paopao-logo.svg" alt="" />
                </span>
                <span class="project-label">泡泡</span>
              </button>
            </div>
            <span class="maker-stamp" id="maker-stamp" aria-hidden="true"></span>
          </div>
        </div>

        <aside class="preview-drawer" id="project-preview" aria-live="polite" aria-atomic="true" aria-hidden="true" inert>
          <img class="preview-thumb" id="preview-thumb" src="../../src/public/images/home/projects/timeline-og.svg" alt="" />
          <span class="preview-copy">
            <small class="preview-eyebrow" id="preview-eyebrow">大模型事件档案</small>
            <strong class="preview-title" id="preview-title">模型纪年</strong>
            <span class="preview-summary" id="preview-summary">沿时间理解大模型进化。</span>
          </span>
          <a class="preview-link" id="preview-link" href="https://timeline.aicando.xyz/" target="_blank" rel="noopener">查看项目 <span aria-hidden="true">→</span></a>
        </aside>
      </div>
      <p class="showcase-caption">六个主要产品与作品 · 悬停、聚焦或轻点一枚饼干</p>
    </section>
  </main>

  <p class="interaction-note">
    <strong>交互原型：</strong>鼠标悬停或键盘聚焦时“拿起”饼干，说明签从烤盘底部抽出；触屏第一次轻点只选择，之后通过说明签进入项目。按 Esc 或点击烘焙纸空白处可收起。
  </p>

  <script>
    const projects = {
      timeline: {
        eyebrow: '大模型事件档案',
        title: '模型纪年',
        summary: '沿时间理解大模型进化。',
        image: '../../src/public/images/home/projects/timeline-og.svg',
        href: 'https://timeline.aicando.xyz/',
        angle: '-122deg'
      },
      aicando: {
        eyebrow: 'AI 能力与实践站点',
        title: 'AiCanDo',
        summary: '持续回答：AI 到底能做什么。',
        image: '../../src/public/images/home/projects/aicando-og.svg',
        href: 'https://www.aicando.xyz/',
        angle: '-82deg'
      },
      'agent-controller': {
        eyebrow: 'Codex 控制器',
        title: 'Agent Controller',
        summary: '用游戏手柄控制 Codex。',
        image: '../../src/public/images/home/projects/agent-controller-og.webp',
        href: 'https://github.com/gantrol/AgentController',
        angle: '-42deg'
      },
      aiy: {
        eyebrow: 'AI 创作管理工具',
        title: 'AIY',
        summary: '让 AI 创作结果、提示词和素材继续积累。',
        image: '../../src/public/images/home/projects/aiy-og.webp',
        href: 'https://github.com/gantrol/aiy-desktop/releases/latest',
        angle: '-154deg'
      },
      markdowncando: {
        eyebrow: 'Markdown 演练场',
        title: 'MarkdownCanDo',
        summary: '看看纯文本到底能做多少事。',
        image: '../../src/public/images/home/projects/markdowncando-og.webp',
        href: 'https://markdown.aicando.xyz/',
        angle: '-116deg'
      },
      paopao: {
        eyebrow: '本地优先的信息空间',
        title: '泡泡',
        summary: '先让思绪流动，再把信息放对地方。',
        image: '../../src/public/images/home/projects/paopao-og.svg',
        href: 'https://github.com/gantrol/paopao-desktop',
        angle: '-72deg'
      }
    }

    const stage = document.querySelector('#tray-stage')
    const tray = document.querySelector('#project-tray')
    const previewDrawer = document.querySelector('#project-preview')
    const buttons = [...document.querySelectorAll('.project-item')]
    const stamp = document.querySelector('#maker-stamp')
    const previewThumb = document.querySelector('#preview-thumb')
    const previewEyebrow = document.querySelector('#preview-eyebrow')
    const previewTitle = document.querySelector('#preview-title')
    const previewSummary = document.querySelector('#preview-summary')
    const previewLink = document.querySelector('#preview-link')
    let clearTimer = 0

    function selectProject(button) {
      const project = projects[button.dataset.project]
      if (!project) return

      window.clearTimeout(clearTimer)
      stage.classList.add('has-selection')
      previewDrawer.removeAttribute('inert')
      previewDrawer.setAttribute('aria-hidden', 'false')
      buttons.forEach((candidate) => {
        const active = candidate === button
        candidate.classList.toggle('is-active', active)
        candidate.setAttribute('aria-expanded', String(active))
      })

      previewThumb.src = project.image
      previewEyebrow.textContent = project.eyebrow
      previewTitle.textContent = project.title
      previewSummary.textContent = project.summary
      previewLink.href = project.href
      previewLink.setAttribute('aria-label', `打开 ${project.title}`)
      stamp.style.setProperty('--stamp-angle', project.angle)
    }

    function clearProject({ immediate = false } = {}) {
      window.clearTimeout(clearTimer)
      const clear = () => {
        if (stage.contains(document.activeElement)) return
        stage.classList.remove('has-selection')
        previewDrawer.setAttribute('inert', '')
        previewDrawer.setAttribute('aria-hidden', 'true')
        buttons.forEach((button) => {
          button.classList.remove('is-active')
          button.setAttribute('aria-expanded', 'false')
        })
        stamp.style.setProperty('--stamp-angle', '0deg')
      }
      if (immediate) clear()
      else clearTimer = window.setTimeout(clear, 220)
    }

    buttons.forEach((button) => {
      button.addEventListener('pointerenter', () => selectProject(button))
      button.addEventListener('focus', () => selectProject(button))
      button.addEventListener('click', () => selectProject(button))
    })

    stage.addEventListener('pointerleave', (event) => {
      if (event.pointerType !== 'touch') clearProject()
    })
    stage.addEventListener('pointerenter', () => window.clearTimeout(clearTimer))
    stage.addEventListener('focusout', (event) => {
      if (!stage.contains(event.relatedTarget)) clearProject()
    })
    stage.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return
      event.preventDefault()
      event.target.blur()
      clearProject({ immediate: true })
    })
    tray.addEventListener('click', (event) => {
      if (event.target.closest('.project-item')) return
      clearProject({ immediate: true })
    })

    selectProject(buttons[0])
  </script>
</body>
</html>

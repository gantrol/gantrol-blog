<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title description">
  <title id="title">AICanDo</title>
  <desc id="description">A map of AI capabilities across text and code, image and video, music and voice</desc>
  <rect width="1200" height="630" rx="32" fill="#FFFEFB"/>
  <circle cx="1080" cy="50" r="270" fill="#F7F9E7"/>
  <circle cx="80" cy="650" r="300" fill="#F1F9FA"/>
  <image
    href="data:image/webp;base64,"
    x="72"
    y="154"
    width="282"
    height="282"
    preserveAspectRatio="xMidYMid meet"
  />
  <text x="392" y="245" fill="#262320" font-family="Inter, Segoe UI, sans-serif" font-size="82" font-weight="700">AI Capability Map</text>
  <g transform="translate(392 326)" font-family="Inter, Segoe UI, Microsoft YaHei UI, sans-serif">
    <rect width="214" height="104" rx="24" fill="#EFF8FB" stroke="#CDE5EB" stroke-width="2"/>

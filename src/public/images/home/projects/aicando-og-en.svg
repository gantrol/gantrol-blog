    <rect x="476" width="214" height="104" rx="24" fill="#FCF0F6" stroke="#F0D3E1" stroke-width="2"/>
    <text x="583" y="66" fill="#DB2777" font-size="22" font-weight="700" text-anchor="middle">Z · Music &amp; Voice</text>
